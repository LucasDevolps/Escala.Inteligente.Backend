name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ScheduleManager.slnx
      - run: dotnet build ScheduleManager.slnx --configuration Release --no-restore
      - run: dotnet test ScheduleManager.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
